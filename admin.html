<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin – La libreria di Luca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f2f4;--ink:#14181f;--mute:#5d6572;--line:#d9dce2;--card:#fff;--acc:#2f45d8;--acc-ink:#fff;--ok:#1f7a45;--err:#b3261e;
  --serif:"Literata",Georgia,serif;--sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#101215;--ink:#eceef2;--mute:#9aa2af;--line:#272b33;--card:#181b20;--acc:#8ea0ff;--acc-ink:#101215;--ok:#6fcf97;--err:#f2867f}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px 64px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;padding:32px 0 20px}
h1{font-family:var(--serif);font-size:clamp(26px,5vw,38px);letter-spacing:-.02em;margin:0}
.nav{display:flex;gap:16px;font-size:14px}
a,.link{color:var(--acc);text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;cursor:pointer}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.login{max-width:380px;margin:24px 0}
label{display:grid;gap:6px;font-size:14px;color:var(--mute)}
input,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:240px;resize:vertical;font-family:var(--serif);font-size:16px;line-height:1.65}
.btn{font-weight:600;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{margin:0;font-size:14px;min-height:1.4em;color:var(--mute)}
.msg.ok{color:var(--ok)}.msg.err{color:var(--err)}
.cols{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:20px;align-items:start}
.list{padding:6px;max-height:70vh;overflow:auto}
.item{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;padding:10px 12px;border-radius:10px;cursor:pointer}
.item:hover{background:color-mix(in srgb,var(--acc) 8%,transparent)}
.item[aria-current=true]{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.item:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.item b{font-weight:600;font-size:15px;line-height:1.3}
.item span{font-size:13px;color:var(--mute);grid-column:1}
.dot{grid-column:2;grid-row:1 / span 2;align-self:center;width:9px;height:9px;border-radius:50%;background:var(--ok)}
.editor h2{font-family:var(--serif);font-size:24px;line-height:1.15;letter-spacing:-.02em;margin:0}
.editor .by{margin:4px 0 16px;color:var(--mute)}
.count{font-size:13px;color:var(--mute);justify-self:end}
[hidden]{display:none!important}
@media (max-width:760px){.cols{grid-template-columns:1fr}.list{max-height:42vh}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Note sui libri</h1>
    <div class="nav"><a href="./">Torna alla libreria</a><button class="link" id="out" hidden>Esci</button></div>
  </header>

  <form class="panel login" id="login">
    <label>Password admin<input id="pw" type="password" autocomplete="current-password" required></label>
    <div class="row" style="margin-top:14px"><button class="btn pri" type="submit">Entra</button><p class="msg" id="loginMsg" role="alert"></p></div>
  </form>

  <div class="cols" id="app" hidden>
    <nav class="panel list" id="list" aria-label="Libri"></nav>
    <form class="panel editor" id="editor" hidden>
      <h2 id="bt"></h2>
      <p class="by" id="ba"></p>
      <label>La mia nota
        <textarea id="note" maxlength="2000" placeholder="Perché lo consiglio, cosa mi è rimasto…"></textarea>
        <span class="count" id="count"></span>
      </label>
      <div class="row" style="margin-top:14px">
        <button class="btn pri" type="submit" id="save">Salva nota</button>
        <button class="btn" type="button" id="del">Rimuovi nota</button>
        <p class="msg" id="msg" role="status" aria-live="polite"></p>
      </div>
    </form>
    <div class="panel editor" id="hint"><p class="msg">Scegli un libro dall'elenco per scrivere la tua nota. Il pallino verde indica i libri che hanno già una nota.</p></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const keyOf = b => `${b.title}|${b.author}`.toLowerCase();
let BOOKS = [], NOTES = {}, cur = null, pw = "";
try { pw = sessionStorage.getItem("pw") || ""; } catch {}

const say = (el, t, kind = "") => { el.textContent = t; el.className = "msg" + (kind ? " " + kind : ""); };

async function api(body) {
  const r = await fetch("/api/notes", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw, ...body }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Errore di connessione.");
  return d;
}

function renderList() {
  const l = $("#list"); l.replaceChildren();
  BOOKS.forEach(b => {
    const it = document.createElement("button"); it.type = "button"; it.className = "item";
    it.setAttribute("aria-current", String(cur === b));
    const t = document.createElement("b"); t.textContent = b.title;
    const a = document.createElement("span"); a.textContent = b.author;
    it.append(t, a);
    if (NOTES[keyOf(b)]) { const d = document.createElement("i"); d.className = "dot"; d.title = "Ha una nota"; it.appendChild(d); }
    it.onclick = () => choose(b);
    l.appendChild(it);
  });
}

function choose(b) {
  cur = b;
  $("#bt").textContent = b.title; $("#ba").textContent = b.author;
  $("#note").value = NOTES[keyOf(b)] || ""; updateCount();
  say($("#msg"), ""); $("#del").hidden = !NOTES[keyOf(b)];
  $("#editor").hidden = false; $("#hint").hidden = true;
  renderList();
  if (matchMedia("(max-width:760px)").matches) $("#editor").scrollIntoView({ behavior: "smooth", block: "start" });
}
const updateCount = () => { $("#count").textContent = `${$("#note").value.length} / 2000`; };
$("#note").oninput = updateCount;

async function save(remove) {
  if (!cur) return;
  const btns = [$("#save"), $("#del")]; btns.forEach(b => b.disabled = true);
  say($("#msg"), "Salvo…");
  try {
    const note = remove ? "" : $("#note").value.trim();
    await api({ title: cur.title, author: cur.author, note });
    if (note) NOTES[keyOf(cur)] = note; else NOTES = Object.fromEntries(Object.entries(NOTES).filter(([k]) => k !== keyOf(cur)));
    $("#note").value = note; updateCount(); $("#del").hidden = !note;
    say($("#msg"), note ? "Nota salvata. Sul sito compare entro pochi secondi." : "Nota rimossa.", "ok");
    renderList();
  } catch (e) { say($("#msg"), e.message, "err"); }
  finally { btns.forEach(b => b.disabled = false); }
}
$("#editor").onsubmit = e => { e.preventDefault(); save(false); };
$("#del").onclick = () => { if (confirm("Rimuovere la nota di questo libro?")) save(true); };

async function enter() {
  const [bk, nt] = await Promise.all([
    fetch("books.json", { cache: "no-store" }).then(r => r.json()),
    fetch("/api/notes", { cache: "no-store" }).then(r => r.ok ? r.json() : { notes: {} }).catch(() => ({ notes: {} }))
  ]);
  BOOKS = Array.isArray(bk) ? bk : []; NOTES = (nt && nt.notes) || {};
  $("#login").hidden = true; $("#app").hidden = false; $("#out").hidden = false;
  renderList();
}

$("#login").onsubmit = async e => {
  e.preventDefault(); pw = $("#pw").value;
  say($("#loginMsg"), "Controllo…");
  try { await api({ action: "check" }); try { sessionStorage.setItem("pw", pw); } catch {} say($("#loginMsg"), ""); await enter(); }
  catch (err) { say($("#loginMsg"), err.message, "err"); }
};
$("#out").onclick = () => { try { sessionStorage.removeItem("pw"); } catch {} location.reload(); };

if (pw) api({ action: "check" }).then(enter).catch(() => { try { sessionStorage.removeItem("pw"); } catch {} pw = ""; });
</script>
</body>
</html>
