<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La mia libreria</title>
<meta name="description" content="I libri che ho letto, con trama e tag.">
<meta property="og:type" content="website">
<meta property="og:title" content="La mia libreria">
<meta property="og:description" content="I libri che ho letto, con trama e tag.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f3f5;--ink:#14181f;--mute:#5d6572;--line:#d9dce2;--card:#fff;--acc:#2f45d8;--acc-ink:#fff;
--font:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101215;--ink:#eceef2;--mute:#9aa2af;--line:#272b33;--card:#181b20;--acc:#8ea0ff;--acc-ink:#101215}}
:root[data-theme=dark]{--bg:#101215;--ink:#eceef2;--mute:#9aa2af;--line:#272b33;--card:#181b20;--acc:#8ea0ff;--acc-ink:#101215}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{padding:56px 0 24px;position:relative}
.lang{position:absolute;top:18px;right:0;display:flex;gap:6px}
h1{font-size:clamp(40px,8vw,84px);line-height:.95;letter-spacing:-.04em;font-weight:800;margin:0 0 14px}
header p{margin:0;color:var(--mute);max-width:52ch;font-size:18px}
.bar{background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.search{width:100%;font:inherit;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip.more{border-style:dashed}
.chip{flex:none;font:inherit;font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.chip:focus-visible,.book:focus-visible,.search:focus-visible,.close:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:32px 22px;padding:32px 0 80px}
.book{all:unset;cursor:pointer;display:block}
.cov{position:relative;aspect-ratio:2/3;border-radius:4px 8px 8px 4px;overflow:hidden;background:var(--line);
box-shadow:0 1px 2px rgba(0,0,0,.25),0 10px 24px -12px rgba(0,0,0,.45);transition:transform .2s ease}
.book:hover .cov,.book:focus-visible .cov{transform:translateY(-6px)}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.cov.ph{display:flex;flex-direction:column;justify-content:space-between;padding:14px;background:var(--line);color:var(--ink)}
.cov.ph b{font-size:18px;line-height:1.1;letter-spacing:-.02em}.cov.ph span{font-size:12px;opacity:.85}
.t{margin:12px 0 0;font-weight:700;font-size:15px;line-height:1.25}.a{margin:2px 0 0;color:var(--mute);font-size:13px}
.empty{grid-column:1/-1;color:var(--mute);padding:40px 0}
dialog{border:0;padding:0;background:var(--card);color:var(--ink);border-radius:16px;width:min(860px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;font-family:var(--font)}
dialog::backdrop{background:rgba(8,10,14,.6)}
dialog[open]{animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.det{display:grid;grid-template-columns:240px 1fr;gap:32px;padding:32px}
.det .cov{transform:none}
.picker{padding:28px}
.picker h2{margin:0 0 4px}
.picker p.hint{margin:0 0 16px;color:var(--mute);font-size:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px}
.pgrid button{all:unset;cursor:pointer}
.pgrid img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:4px 8px 8px 4px;display:block;border:2px solid transparent}
.pgrid button:hover img,.pgrid button:focus-visible img{border-color:var(--acc)}
.pgrid .own{border-top:1px dashed var(--line);margin-top:16px;padding-top:16px}
.pgrid input{font:inherit;width:100%}
.det h2{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.03em}
.det .by{color:var(--mute);margin:6px 0 16px}
.det p{margin:0 0 14px;max-width:62ch}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.tag{font-size:13px;padding:3px 11px;border-radius:999px;border:1px solid var(--line)}
.note{border-left:3px solid var(--acc);padding-left:14px;color:var(--mute)}
.close{all:unset;position:absolute;top:12px;right:14px;cursor:pointer;width:36px;height:36px;display:grid;place-items:center;font-size:24px;border-radius:50%;background:var(--card)}
[hidden]{display:none!important}
.frm{padding:32px;display:grid;gap:14px}
.frm h2{margin:0 0 4px;font-size:26px;letter-spacing:-.03em}
.frm label{display:grid;gap:6px;font-size:14px;color:var(--mute)}
.frm input,.frm textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.frm textarea{min-height:150px;resize:vertical}
.frm input:focus-visible,.frm textarea:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn:disabled{opacity:.5;cursor:default}
#msg{margin:0;font-size:14px;color:var(--mute);min-height:1.4em}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:640px){.det{grid-template-columns:1fr;padding:20px}.det .cov{max-width:180px}.grid{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="lang" role="group" aria-label="Lingua / Language"><button class="chip" data-l="it">IT</button><button class="chip" data-l="en">EN</button></div>
    <h1 id="h1">La mia libreria</h1>
    <p id="intro">I libri che ho letto, con trama e tag. Cliccate una copertina per leggere di cosa parla.</p>
    <p class="row"><button class="btn pri" id="addBtn">Aggiungi libro</button><button class="btn" id="importBtn">Importa da books.json</button><button class="btn" id="coversBtn">Salva copertine</button></p>
  </header>
  <div class="bar">
    <input class="search" id="q" type="search" placeholder="Cerca per titolo, autore o tag" aria-label="Cerca un libro">
    <div class="chips" id="chips" role="group" aria-label="Filtra per tag"></div>
  </div>
  <main class="grid" id="grid"></main>
</div>

<dialog id="dlg" aria-labelledby="dt">
  <button class="close" id="x" aria-label="Chiudi">×</button>
  <div class="det" id="det"></div>
</dialog>

<dialog id="addDlg" aria-labelledby="addT">
  <button class="close" id="x2" aria-label="Chiudi">×</button>
  <form class="frm" id="frm">
    <h2 id="addT">Aggiungi un libro</h2>
    <label>Titolo<input name="titolo" required maxlength="200" autocomplete="off"></label>
    <label>Autore<input name="autore" required maxlength="200" autocomplete="off"></label>
    <label>Tag, separati da virgola (argomento o ambientazione)<input name="tag" required placeholder="Romanzo, Russia, Storia"></label>
    <label>Trama<textarea name="trama" required maxlength="2500"></textarea></label>
    <div class="row"><button class="btn" type="button" id="find">Cerca la trama</button></div>
    <label>Il mio commento (facoltativo)<textarea name="nota" maxlength="1000" style="min-height:70px"></textarea></label>
    <label>Titolo in inglese (solo se esiste un'edizione inglese)<input name="titoloEn" maxlength="200" autocomplete="off"></label>
    <label>Trama in inglese (facoltativa)<textarea name="plotEn" maxlength="2500" style="min-height:90px"></textarea></label>
    <label>Tag in inglese, stesso numero e stesso ordine di quelli italiani (facoltativi)<input name="tagEn" placeholder="Novel, Russia, History"></label>
    <div class="row"><button class="btn" type="button" id="pickCover">Scegli copertina</button><span id="pickPreview" style="font-size:13px;color:var(--mute)"></span></div>
    <input type="hidden" name="coverManual">
    <label>ISBN (facoltativo, utile solo se non scegli una copertina qui sopra)<input name="isbn" maxlength="20" inputmode="numeric" autocomplete="off"></label>
    <label>Password<input name="pw" type="password" required autocomplete="current-password"></label>
    <p id="msg" aria-live="polite"></p>
    <div class="row"><button class="btn pri" type="submit" id="save">Salva libro</button></div>
  </form>
</dialog>

<dialog id="coverDlg" aria-labelledby="cpt">
  <button class="close" id="x3" aria-label="Chiudi">×</button>
  <div class="picker">
    <h2 id="cpt">Scegli la copertina</h2>
    <p class="hint" id="cpHint">Cerco le copertine disponibili…</p>
    <div class="pgrid" id="pgrid"></div>
    <div class="pgrid own">
      <label style="grid-column:1/-1">Oppure incolla l'indirizzo di un'immagine (URL)
        <div class="row" style="margin-top:6px"><input id="cpUrl" type="url" placeholder="https://..."><button class="btn" type="button" id="cpUse">Usa</button></div>
      </label>
    </div>
  </div>
</dialog>
<div id="toast" role="status" hidden></div>

<script>

const $ = s => document.querySelector(s);
const cache = (() => { try { return JSON.parse(localStorage.getItem("covers2") || "{}"); } catch { return {}; } })();
const saveCache = () => { try { localStorage.setItem("covers2", JSON.stringify(cache)); } catch {} };
const key = b => b.title + "|" + b.author;
let BOOKS = [], tag = null, query = "", loaded = false, cur = null, chipsOpen = false;

const I18N = {
  it: { h1: "La mia libreria", intro: "I libri che ho letto, con trama e tag. Cliccate una copertina per leggere di cosa parla.", desc: "I libri che ho letto, con trama e tag.",
        search: "Cerca per titolo, autore o tag", searchAria: "Cerca un libro", all: "Tutti", chipsAria: "Filtra per tag",
        none: "Nessun libro corrisponde. Prova a togliere un filtro.", empty: "Ancora nessun libro.", close: "Chiudi", cover: "Copertina di", open: "Apri la trama", more: "Altri tag", less: "Meno tag" },
  en: { h1: "My library", intro: "The books I've read, with plots and tags. Click a cover to see what it's about.", desc: "The books I've read, with plots and tags.",
        search: "Search by title, author or tag", searchAria: "Search for a book", all: "All", chipsAria: "Filter by tag",
        none: "No books match. Try removing a filter.", empty: "No books yet.", close: "Close", cover: "Cover of", open: "Open plot", more: "More tags", less: "Fewer tags" }
};
let lang = (() => {
  try { const s = localStorage.getItem("lang"); if (s === "it" || s === "en") return s; } catch {}
  return /^en/i.test(navigator.language || "") ? "en" : "it";
})();
const L = k => I18N[lang][k];
const ttl = b => (lang === "en" && b.titleEn) || b.title;
const plotOf = b => (lang === "en" && b.plotEn) || b.plot;
const tagLabel = t => {
  if (lang !== "en") return t;
  for (const b of BOOKS) { const i = b.tags.indexOf(t); if (i >= 0 && b.tagsEn && b.tagsEn[i]) return b.tagsEn[i]; }
  return t;
};

const enc = encodeURIComponent;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const norm = s => (s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
let qTail = Promise.resolve();
const queued = fn => { const p = qTail.then(fn); qTail = p.then(() => sleep(150), () => sleep(150)); return p; };
async function getJSON(url) {
  for (let i = 0; i < 3; i++) {
    const r = await fetch(url);
    if (r.status === 429 || r.status >= 500) { await sleep(800 * (i + 1)); continue; }
    return r.ok ? r.json() : null;
  }
  return null;
}
const surname = b => norm(b.author.split(/ e |,| & /)[0]).split(" ").pop();
const shortTitle = b => b.title.split(/[.:]/)[0].trim();
// Sceglie la copertina il cui titolo e autore corrispondono davvero al libro
// Un ISBN che comincia con 978-88 (o il vecchio formato 88-...) è un'edizione registrata in Italia:
// è un segnale oggettivo, a differenza del campo "lingua" di Google Books, spesso assente o sbagliato.
const isItalianIsbn = ids => (ids || []).some(x => /^(97888|88)/.test(String(x.identifier || "").replace(/[^0-9Xx]/g, "")));
function pick(cands, b) {
  const nt = norm(b.title), na = surname(b);
  let best = null, top = 0;
  for (const c of cands) {
    const t = norm(c.title);
    if (!t) continue;
    let s = t === nt ? 4 : (t.startsWith(nt) || nt.startsWith(t)) ? 3 : t.includes(nt) ? 2 : 0;
    if (!s) continue;
    const au = (c.authors || []).some(a => norm(a).includes(na));
    s += au ? 2 : 0;
    if (s > top) { top = s; best = c; }
  }
  return best ? best.url : "";
}
async function fromGoogle(b) {
  const d = await getJSON("https://www.googleapis.com/books/v1/volumes?maxResults=20&printType=books&country=IT&fields=items(volumeInfo(title,authors,imageLinks,industryIdentifiers))"
    + "&q=" + enc(`intitle:${shortTitle(b)} inauthor:${surname(b)}`));
  const cands = ((d && d.items) || []).map(i => i.volumeInfo || {})
    .filter(v => v.imageLinks && isItalianIsbn(v.industryIdentifiers))
    .map(v => ({ title: v.title, authors: v.authors, url: v.imageLinks.thumbnail.replace("http:", "https:").replace("&edge=curl", "").replace("zoom=1", "zoom=2") }));
  return pick(cands, b);
}
async function fromOpenLibrary(b) {
  const d = await getJSON(`https://openlibrary.org/search.json?limit=20&fields=title,author_name,cover_i,isbn&title=${enc(shortTitle(b))}&author=${enc(surname(b))}`);
  const cands = ((d && d.docs) || []).filter(x => x.cover_i && (x.isbn || []).some(i => /^(97888|88)/.test(i)))
    .map(x => ({ title: x.title, authors: x.author_name, url: `https://covers.openlibrary.org/b/id/${x.cover_i}-L.jpg` }));
  return pick(cands, b);
}
async function candidatesFrom(b) {
  const out = [];
  const seen = new Set();
  const push = (url, title, authors) => { if (url && !seen.has(url)) { seen.add(url); out.push({ url, title: title || "", authors: authors || [] }); } };
  try {
    const d = await getJSON("https://www.googleapis.com/books/v1/volumes?maxResults=20&printType=books&country=IT&fields=items(volumeInfo(title,authors,imageLinks,industryIdentifiers))"
      + "&q=" + enc(`intitle:${shortTitle(b)} inauthor:${surname(b)}`));
    // Le edizioni italiane (ISBN 978-88) prima, le altre dopo.
    const items = ((d && d.items) || []).map(i => i.volumeInfo || {}).filter(v => v.imageLinks);
    items.sort((a, z) => isItalianIsbn(z.industryIdentifiers) - isItalianIsbn(a.industryIdentifiers));
    for (const v of items) push(v.imageLinks.thumbnail.replace("http:", "https:").replace("&edge=curl", "").replace("zoom=1", "zoom=2"), v.title, v.authors);
  } catch {}
  try {
    const d = await getJSON(`https://openlibrary.org/search.json?limit=20&fields=title,author_name,cover_i&title=${enc(shortTitle(b))}&author=${enc(surname(b))}`);
    for (const x of (d && d.docs) || []) if (x.cover_i) push(`https://covers.openlibrary.org/b/id/${x.cover_i}-L.jpg`, x.title, x.author_name);
  } catch {}
  try {
    const d = await getJSON(`https://openlibrary.org/search.json?limit=20&fields=title,author_name,cover_i&q=${enc(b.title + " " + b.author)}`);
    for (const x of (d && d.docs) || []) if (x.cover_i) push(`https://covers.openlibrary.org/b/id/${x.cover_i}-L.jpg`, x.title, x.author_name);
  } catch {}
  return out;
}

const inflight = {};
function lookup(b) {
  const k = key(b);
  if (cache[k]) return Promise.resolve(cache[k]);
  return inflight[k] || (inflight[k] = queued(async () => {
    for (const src of [fromGoogle, fromOpenLibrary]) {
      try { const u = await src(b); if (u) { cache[k] = u; saveCache(); return u; } } catch {}
    }
    return "";
  }).finally(() => { delete inflight[k]; }));
}
async function findCover(b) {
  if (b.cover) return b.cover;
  if (b.isbn) return `https://books.google.com/books/content?vid=ISBN${b.isbn}&printsec=frontcover&img=1&zoom=1`;
  return lookup(b);
}

function coverEl(b, big) {
  const d = document.createElement("div");
  d.className = "cov ph";
  d.innerHTML = `<b></b><span></span>`;
  d.firstChild.textContent = ttl(b); d.lastChild.textContent = b.author;
  const show = (src, retry) => {
    const im = new Image(); im.alt = `${L("cover")} ${ttl(b)}`;
    im.onload = () => {
      if (im.naturalWidth < 60) return im.onerror();
      d.className = "cov"; d.replaceChildren(im);
    };
    im.onerror = () => {
      if (src.includes("zoom=2")) return show(src.replace("zoom=2", "zoom=1"), retry);
      if (retry) lookup(b).then(u => u && u !== src && show(u, false));
    };
    im.src = src;
  };
  findCover(b).then(src => { if (src) show(src, !!(b.cover || b.isbn)); });
  return d;
}

function render() {
  const q = query.trim().toLowerCase();
  const list = BOOKS.filter(b =>
    (!tag || b.tags.includes(tag)) &&
    (!q || (b.title + " " + (b.titleEn || "") + " " + b.author + " " + b.tags.join(" ") + " " + (b.tagsEn || []).join(" ")).toLowerCase().includes(q)));
  const g = $("#grid"); g.replaceChildren();
  if (!loaded) return;
  if (!list.length) { g.innerHTML = `<p class="empty">${BOOKS.length ? L("none") : L("empty")}</p>`; return; }
  list.forEach(b => {
    const btn = document.createElement("button"); btn.className = "book";
    btn.setAttribute("aria-label", `${ttl(b)}, ${b.author}. ${L("open")}`);
    btn.appendChild(coverEl(b, false));
    const t = document.createElement("p"); t.className = "t"; t.textContent = ttl(b);
    const a = document.createElement("p"); a.className = "a"; a.textContent = b.author;
    btn.append(t, a); btn.onclick = () => open(b); g.appendChild(btn);
  });
}

function chips() {
  const cnt = {};
  BOOKS.forEach(b => b.tags.forEach(t => { cnt[t] = (cnt[t] || 0) + 1; }));
  const all = Object.keys(cnt).sort((x, y) => cnt[y] - cnt[x] || tagLabel(x).localeCompare(tagLabel(y), lang));
  const LIMIT = 14;
  const shown = chipsOpen ? all : all.filter((t, i) => i < LIMIT || t === tag);
  const c = $("#chips"); c.replaceChildren();
  [[L("all"), null], ...shown.map(t => [tagLabel(t), t])].forEach(([label, val]) => {
    const b = document.createElement("button"); b.className = "chip"; b.textContent = label;
    b.setAttribute("aria-pressed", String(tag === val));
    b.onclick = () => { tag = val; chips(); render(); }; c.appendChild(b);
  });
  if (all.length > LIMIT) {
    const m = document.createElement("button"); m.className = "chip more";
    m.textContent = chipsOpen ? L("less") : `${L("more")} (${all.length - shown.length})`;
    m.onclick = () => { chipsOpen = !chipsOpen; chips(); }; c.appendChild(m);
  }
}

function open(b) {
  cur = b;
  const det = $("#det"); det.replaceChildren();
  det.appendChild(coverEl(b, true));
  const box = document.createElement("div");
  const h = document.createElement("h2"); h.id = "dt"; h.textContent = ttl(b);
  const by = document.createElement("p"); by.className = "by"; by.textContent = b.author;
  const tg = document.createElement("div"); tg.className = "tags";
  b.tags.forEach(t => { const s = document.createElement("span"); s.className = "tag"; s.textContent = tagLabel(t); tg.appendChild(s); });
  const p = document.createElement("p"); p.textContent = plotOf(b);
  box.append(h, by, tg, p);
  if (b.note) { const n = document.createElement("p"); n.className = "note"; n.textContent = b.note; box.appendChild(n); }
  {
    const row = document.createElement("div"); row.className = "row"; row.style.marginTop = "6px";
    const ch = document.createElement("button"); ch.className = "btn"; ch.textContent = "Cambia copertina";
    ch.onclick = () => openPicker(b, async url => {
      try {
        let pw = ""; try { pw = sessionStorage.getItem("pw") || ""; } catch {}
        if (!pw) pw = prompt("Password admin") || "";
        if (!pw) return;
        const r = await fetch("/api/books", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw, action: "covers", covers: [{ title: b.title, author: b.author, cover: url }] }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) return toast(d.error || "Errore nel salvataggio.");
        try { sessionStorage.setItem("pw", pw); } catch {}
        b.cover = url; cache[key(b)] = url; saveCache();
        render(); open(b); toast("Copertina aggiornata.");
      } catch { toast("Connessione non riuscita. Riprova."); }
    });
    const del = document.createElement("button"); del.className = "btn"; del.textContent = "Elimina libro";
    del.onclick = () => removeBook(b);
    row.append(ch, del); box.appendChild(row);
  }
  det.appendChild(box); if (!$("#dlg").open) $("#dlg").showModal();
}

$("#q").oninput = e => { query = e.target.value; render(); };
$("#x").onclick = () => $("#dlg").close();
$("#dlg").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

/* ---- Aggiunta libri (visibile solo aprendo il sito con #admin) ---- */
const addDlg = $("#addDlg"), frm = $("#frm"), msg = $("#msg");
const say = t => { msg.textContent = t; };
let tt; const toast = t => { const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => el.hidden = true, 6000); };
$("#addBtn").onclick = () => {
  frm.reset(); say(""); $("#pickPreview").textContent = "";
  try { frm.elements.pw.value = sessionStorage.getItem("pw") || ""; } catch {}
  addDlg.showModal();
};
$("#x2").onclick = () => addDlg.close();
addDlg.addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

$("#find").onclick = async () => {
  const t = frm.elements.titolo.value.trim(), a = frm.elements.autore.value.trim();
  if (!t) return say("Scrivi almeno il titolo.");
  say("Cerco la trama…");
  const q = enc(`intitle:${t}` + (a ? ` inauthor:${a}` : ""));
  for (const lang of ["&langRestrict=it", ""]) {
    try {
      const r = await fetch(`https://www.googleapis.com/books/v1/volumes?maxResults=8&fields=items(volumeInfo(description))${lang}&q=${q}`);
      const d = ((await r.json()).items || []).map(i => i.volumeInfo.description).find(Boolean);
      if (d) { frm.elements.trama.value = d.replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim(); return say("Trama trovata: riscrivila con parole tue o accorciala."); }
    } catch {}
  }
  say("Nessuna trama trovata: scrivila tu.");
};

frm.onsubmit = async e => {
  e.preventDefault();
  const el = frm.elements;
  const tags = [...new Set(el.tag.value.split(",").map(s => s.trim()).filter(Boolean).map(s => s[0].toUpperCase() + s.slice(1)))];
  if (!tags.length) return say("Aggiungi almeno un tag.");
  const book = { title: el.titolo.value.trim(), author: el.autore.value.trim(), tags, plot: el.trama.value.trim() };
  if (el.nota.value.trim()) book.note = el.nota.value.trim();
  if (el.isbn.value.trim()) book.isbn = el.isbn.value.trim();
  if (el.titoloEn.value.trim()) book.titleEn = el.titoloEn.value.trim();
  if (el.plotEn.value.trim()) book.plotEn = el.plotEn.value.trim();
  const tagsEn = el.tagEn.value.split(",").map(s => s.trim()).filter(Boolean);
  if (tagsEn.length) {
    if (tagsEn.length !== tags.length) return say("I tag in inglese devono essere tanti quanti quelli italiani, nello stesso ordine.");
    book.tagsEn = tagsEn;
  }
  const btn = $("#save"); btn.disabled = true;
  try {
    if (el.coverManual.value) book.cover = el.coverManual.value;
    else if (!book.isbn) { say("Cerco la copertina…"); const u = await lookup(book); if (u) book.cover = u; }
    say("Salvo…");
    const r = await fetch("/api/books", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: el.pw.value, action: "add", book }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return say(d.error || "Errore nel salvataggio.");
    try { sessionStorage.setItem("pw", el.pw.value); } catch {}
    BOOKS.push(book); addDlg.close(); chips(); render();
    toast("Libro aggiunto.");
  } catch { say("Connessione non riuscita. Riprova."); }
  finally { btn.disabled = false; }
};

function applyLang() {
  document.documentElement.lang = lang;
  document.title = L("h1");
  $("#h1").textContent = L("h1"); $("#intro").textContent = L("intro");
  $("#q").placeholder = L("search"); $("#q").setAttribute("aria-label", L("searchAria"));
  $("#chips").setAttribute("aria-label", L("chipsAria"));
  $("#x").setAttribute("aria-label", L("close")); $("#x2").setAttribute("aria-label", L("close"));
  document.querySelectorAll(".lang .chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.l === lang)));
  document.querySelector('meta[name="description"]').content = L("desc");
  document.querySelector('meta[property="og:description"]').content = L("desc");
  document.querySelector('meta[property="og:title"]').content = L("h1");
  chips(); render();
  if ($("#dlg").open && cur) open(cur);
}
document.querySelectorAll(".lang .chip").forEach(b => b.onclick = () => {
  lang = b.dataset.l; try { localStorage.setItem("lang", lang); } catch {}
  applyLang();
});

$("#coversBtn").onclick = async () => {
  const covers = BOOKS.filter(b => !b.cover && cache[key(b)]).map(b => ({ title: b.title, author: b.author, cover: cache[key(b)] }));
  if (!covers.length) return toast("Nessuna copertina nuova da salvare: aspetta che si carichino e riprova.");
  let pw = ""; try { pw = sessionStorage.getItem("pw") || ""; } catch {}
  if (!pw) pw = prompt("Password admin") || "";
  if (!pw) return;
  try {
    const r = await fetch("/api/books", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw, action: "covers", covers }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return toast(d.error || "Errore nel salvataggio.");
    try { sessionStorage.setItem("pw", pw); } catch {}
    covers.forEach(c => { const b = BOOKS.find(x => x.title === c.title && x.author === c.author); if (b) b.cover = c.cover; });
    toast(`Salvate ${d.count} copertine.`);
  } catch { toast("Connessione non riuscita. Riprova."); }
};

$("#importBtn").onclick = async () => {
  if (!confirm("Sostituire tutta la libreria con i libri del file books.json?")) return;
  let pw = ""; try { pw = sessionStorage.getItem("pw") || ""; } catch {}
  if (!pw) pw = prompt("Password admin") || "";
  if (!pw) return;
  try {
    const r = await fetch("/api/books", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw, action: "import" }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return toast(d.error || "Errore nell'importazione.");
    try { sessionStorage.setItem("pw", pw); } catch {}
    BOOKS = await (await fetch("/api/books", { cache: "no-store" })).json();
    tag = null; chips(); render(); toast(`Importati ${d.count} libri.`);
  } catch { toast("Connessione non riuscita. Riprova."); }
};

function openPicker(b, onPick) {
  const grid = $("#pgrid"), hint = $("#cpHint"), urlBox = $("#cpUrl");
  grid.replaceChildren(); urlBox.value = ""; hint.textContent = "Cerco le copertine disponibili…";
  $("#coverDlg").showModal();
  const use = url => { $("#coverDlg").close(); onPick(url); };
  $("#cpUse").onclick = () => { const u = urlBox.value.trim(); if (u) use(u); };
  candidatesFrom(b).then(list => {
    hint.textContent = list.length ? "Scegli l'edizione giusta, oppure incolla un link qui sotto." : "Nessuna copertina trovata online: incolla un link qui sotto.";
    list.slice(0, 24).forEach(c => {
      const btn = document.createElement("button"); btn.type = "button";
      btn.title = [c.title, (c.authors || []).join(", ")].filter(Boolean).join(" — ");
      const im = new Image(); im.loading = "lazy"; im.alt = btn.title || "Copertina";
      im.onerror = () => btn.remove(); im.src = c.url;
      btn.appendChild(im); btn.onclick = () => use(c.url); grid.appendChild(btn);
    });
  });
}
$("#pickCover").onclick = () => {
  const el = frm.elements;
  if (!el.titolo.value.trim() || !el.autore.value.trim()) return say("Scrivi prima titolo e autore.");
  openPicker({ title: el.titolo.value.trim(), author: el.autore.value.trim() }, url => {
    el.coverManual.value = url; $("#pickPreview").textContent = "Copertina scelta ✓";
  });
};
$("#x3").onclick = () => $("#coverDlg").close();
$("#coverDlg").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

async function removeBook(b) {
  if (!confirm(`Eliminare "${b.title}"?`)) return;
  let pw = ""; try { pw = sessionStorage.getItem("pw") || ""; } catch {}
  if (!pw) pw = prompt("Password admin") || "";
  if (!pw) return;
  try {
    const r = await fetch("/api/books", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: pw, action: "delete", book: { title: b.title, author: b.author } }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) return toast(d.error || "Errore nell'eliminazione.");
    try { sessionStorage.setItem("pw", pw); } catch {}
    BOOKS = BOOKS.filter(x => x !== b);
    if (tag && !BOOKS.some(x => x.tags.includes(tag))) tag = null;
    $("#dlg").close(); chips(); render(); toast("Libro eliminato.");
  } catch { toast("Connessione non riuscita. Riprova."); }
}

(async () => {
  for (const u of ["/api/books", "books.json"]) {
    try {
      const r = await fetch(u, { cache: "no-store" });
      if (r.ok) { const d = await r.json(); if (Array.isArray(d)) { BOOKS = d; break; } }
    } catch {}
  }
  loaded = true;
  applyLang();
})();
</script>
