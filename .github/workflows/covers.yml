name: Scarica copertine

# Si avvia a mano: scheda "Actions" del repository > "Scarica copertine" > "Run workflow"
on: workflow_dispatch

permissions:
  contents: write

jobs:
  covers:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cerca e scarica le copertine
        run: node fetch-covers.mjs
        env:
          GOOGLE_BOOKS_KEY: ${{ secrets.GOOGLE_BOOKS_KEY }}
      - name: Salva nel repository
        run: |
          git config user.name "covers-bot"
          git config user.email "covers-bot@users.noreply.github.com"
          git add covers books.json covers-report.txt
          git commit -m "Aggiungi copertine" || echo "Niente da salvare"
          git push
